name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: mamba-org/setup-micromamba@v2

      - name: Set up environment
        env:
          # The runner has no GPU, so build only the CPU kernels.
          FAST_TRANSFORMERS_DISABLE_CUDA_EXTENSIONS: "1"
        run: bash scripts/setup_env.sh -n leakcurber

      - name: Test
        run: micromamba run -n leakcurber python -m pytest -o addopts="" -m "not gpu and not slow" tests
