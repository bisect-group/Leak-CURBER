# @package _global_

defaults:
  - override /data: baseline_regression
  - override /model: baseline_regression
  # `logger: []` cannot merge into the logger group (DictConfig vs ListConfig).
  - override /logger: null

tags: ["baseline_regression", "sklearn", "ridge"]

data:
  endpoint: ki
  split: random_splits_grouped_smiles
  modalities:
    - smited
    - esmc

model:
  _target_: src.models.baseline_regression_module.BaselineRegressionEstimatorModule
  backend: sklearn
  estimator:
    _target_: sklearn.linear_model.Ridge
    alpha: 1.0
  save_model: true
  save_predictions: true
