_target_: src.data.mlp_datamodule.MLPDataModule

data_dir: ${paths.kinetic_dataset_path}
_split_dir: "substrate_splits"
_difficulty: "hard"


log_dir: ${paths.log_dir}/mlp_datamodule
log_file_name: mlp_datamodule_${now:%Y%m%d_%H%M%S}.log

num_workers: 1
batch_size: 1024 # Needs to be divisible by the number of devices (e.g., if in a distributed setup)
oversample: False
pin_memory: True

train_file: "${._split_dir}/${._difficulty}/train.parquet"
val_file: "${._split_dir}/${._difficulty}/val.parquet"
test_file: "${._split_dir}/${._difficulty}/test.parquet"

task_type: "regression"  # "regression" or "classification"
impute_strat: "zero"  # "zero", "mean"
label_col: "log10_value"
value_types:
  - kcat
  - km
  - ki

modalities:
  - smiles_1d_embedding
  - smiles_2d_embedding
  - smiles_3d_embedding
  - smiles_clamp_embedding
  - ecfp
  - atom_pair_fp
  - esmc_embedding
  - esm3_embedding
  - value_type_embedding

embedding_files:
  smiles_1d_embedding: "unified_kinetic_params_bartsmiles_embeddings.pkl"
  smiles_2d_embedding: "unified_kinetic_params_molr_2d_embeddings.pkl"
  smiles_3d_embedding: "unified_kinetic_params_unimol_3d_embeddings.pkl"
  smiles_clamp_embedding: "unified_kinetic_params_clamp_smiles_embeddings.pkl"
  ecfp: "unified_kinetic_params_smiles_ecfp_embeddings.pkl"
  atom_pair_fp: "unified_kinetic_params_smiles_atom_pair_embeddings.pkl"
  esmc_embedding: "unified_kinetic_params_esmc_embeddings.pkl"
  esm3_embedding: "unified_kinetic_params_esm3_embeddings.pkl"

key_columns:
  smiles_1d_embedding: "smiles"
  smiles_2d_embedding: "smiles"
  smiles_3d_embedding: "smiles"
  smiles_clamp_embedding: "smiles"
  ecfp: "smiles"
  atom_pair_fp: "smiles"
  esmc_embedding: "sequence"
  esm3_embedding: "uniprot_id"
