defaults:
  - _self_

gpu_ids: [0, 1]                          # GPUs used by the other embedding components.

# LocalMapper atom-mapping generator settings. These are used by
# scripts/generate_atom_mapped_reactions.py and the atom-mapping generator.
localmapper_gpu_ids: ${.gpu_ids}         # Physical GPU IDs; with CUDA_VISIBLE_DEVICES=1, use [0] inside the process.
localmapper_model_version: 202403        # LocalMapper checkpoint/template bundle under localmapper/data/.
localmapper_batch_size: 32               # Maximum reactions per GPU batch within an atom-count bucket.
                                        # Larger values improve GPU occupancy but increase VRAM/padding usage.
localmapper_preprocess_workers: null      # CPU processes building RDKit/DGL graphs; null auto-sizes from CPU/GPU count.
localmapper_postprocess_workers: null     # CPU processes doing atom assignment/template extraction; null auto-sizes.
localmapper_queue_size: 4                 # Batches buffered per GPU between CPU preprocessing and GPU inference.
                                        # Larger values smooth CPU/GPU imbalance but use more host RAM.
localmapper_checkpoint_interval: 1000     # Completed rows between partial parquet checkpoints; 0 disables checkpoints.

# Logging configuration
log_dir: ${paths.log_dir}        # Directory for log files (from paths config)

esmc_embeddings_log_file_name: esmc_embeddings.log   # Name of the log file for embeddings processing
esm3_pdbs_log_file_name: esm3_pdbs.log               # Name of the log file for ESM3 PDB processing
esm3_embeddings_log_file_name: esm3_embeddings.log   # Name of the log file for ESM3 embeddings processing

bartsmiles_embeddings_log_file_name: bartsmiles_embeddings.log        # Name of the log file for BARTSMILES processing
smited_embeddings_log_file_name: smited_embeddings.log                # Name of the log file for SMI-TED processing
rxnfp_embeddings_log_file_name: rxnfp_embeddings.log                  # Name of the log file for RXNFP processing
unimol_embeddings_log_file_name: unimol_embeddings.log                # Name of the log file for UNIMOL processing
molr_embeddings_log_file_name: molr_embeddings.log                    # Name of the log file for MolR UNIMOL processing
smiles_ecfp_embeddings_log_file_name: smiles_ecfp_embeddings.log      # Name of the log file for SMILES ECFP processing
smiles_atom_pair_embeddings_log_file_name: smiles_atompair_fp_embeddings.log  # Name of the log file for SMILES AtomPair FP processing
datamol_3dconformers_log_file_name: datamol_3d_conformers.log  # Name of the log file for Datamol 3D conformers generation

datamol_random_seed: 42    # Random seed for reproducibility
datamol_max_attempts: 1000    # Maximum attempts for RDKit operations
datamol_num_conformers: 10    # Number of conformers to generate with RDKit
datamol_conformer_optimization: True    # Whether to perform RDKit conformer optimization
datamol_conformer_timeout_s: 600    # Seconds per molecule for RDKit embedding; a molecule over the limit counts as failed
datamol_conformer_input_pkl_path: ${paths.intermediate_data_dir}/all_canonical_smiles.pkl    # Superset read by Datamol conformer generation and the UniMol SDF embedder (smiles_key field)

# Directory paths for embeddings data
embeddings_path: ${paths.embeddings_path}    # Directory to store embeddings

esmc_embeddings_input_pkl_path: ${paths.intermediate_data_dir}/all_proteins.pkl    # Input pickle path for ESMC embeddings
esmc_model_id: biohub/ESMC-6B
esmc_model_name: ESMC-6B
esmc_version: hf_v1
# Padded-token budget per batch (batch size x longest sequence + 2). `auto` sizes it on each GPU
# from free memory after the model loads, times esmc_vram_fraction. An int fixes it; 4096 was
# verified on an A10 with 22 GiB. Under `auto` the budget scales with free memory on larger GPUs.
esmc_max_batch_tokens: auto
esmc_vram_fraction: 0.8      # Share of free GPU memory used by `auto`
esmc_max_batch_size: 64
esmc_device_map: null
esmc_torch_dtype: bfloat16

sdf_path: ${paths.sdf_path}            # Directory containing SDF molecule files
mol_2d_path: ${paths.mol_path.2D}      # Directory containing 2D molecule files
mol_3d_path: ${paths.mol_path.3D}      # Directory containing 3D molecule files
af_pdb_path: ${paths.af_pdb_path}      # Directory containing AlphaFold PDB files
esm_pdb_path: ${paths.esm_pdb_path}    # Directory containing ESM3 PDB files
esmfold2_pdb_path: ${paths.intermediate_data_dir}/esmfold2_pdb
esmfold2_cif_path: ${paths.intermediate_data_dir}/esmfold2_cif
mmcif_path: ${paths.mmcif_path}              # Directory containing experimental mmCIF files
uniprot_acc_path: ${paths.unirprot_acc_path}  # UniProt accession JSON cache with canonical sequences

esm3_pdbs_input_pkl_path: ${paths.intermediate_data_dir}/all_proteins.pkl          # Input pickle path for ESM3 PDBs
esm3_embeddings_input_pkl_path: ${paths.intermediate_data_dir}/all_proteins.pkl    # Input pickle path for ESM3 embeddings
esm3_featurized_dir: ${paths.raw_data_dir}/esm3_featurized
esm3_keep_featurized_after_success: true
esm3_retry_failed: false   # true re-resolves and retries keys recorded as failed in the feature manifest
esm3_reclaim_last_underfilled_shard: true
esm3_featurize_workers: 80
esm3_featurize_backend: process
esm3_feature_records_per_shard: 5000
esm3_pending_checkpoint_interval_embeddings: 5000
esm3_pending_checkpoint_interval_seconds: 300
esm3_autocast_dtype: bfloat16   # structure encoder dtype: bfloat16 (autocast) or float32; part of the store settings
esm3_max_batch_tokens: 4096
esm3_max_batch_size: 8

esmfold2_log_file_name: esmfold2_structures.log
esmfold2_model_id: biohub/ESMFold2
esmfold2_input_pkl_path: ${paths.intermediate_data_dir}/all_proteins.pkl
esmfold2_manifest_path: ${.esmfold2_cif_path}/manifest.parquet
esmfold2_failures_path: ${.esmfold2_cif_path}/failures.parquet
esmfold2_skip_known_structures: false
esmfold2_max_sequence_length: null  # Sequences longer than this are not folded; null folds all.
esmfold2_msa_dir: null
esmfold2_msa_max_sequences: 1000
esmfold2_num_loops: 3
esmfold2_num_sampling_steps: 50
esmfold2_num_diffusion_samples: 1
esmfold2_seed: 0
esmfold2_write_pdb_compat: true
esmfold2_torch_dtype: bfloat16

smited_embeddings_model_id: bisectgroup/materials-smi-ted-fork
smited_embeddings_batch_size: 1024
smited_embeddings_prefetch_batches: 8
smited_embeddings_tokenize_workers: 8
smited_embeddings_tokenizers_parallelism: true
smited_embeddings_use_autocast: true
smited_embeddings_autocast_dtype: bfloat16
smited_embeddings_input_pkl_path: ${paths.intermediate_data_dir}/all_canonical_smiles.pkl
smited_embeddings_output_pkl_path: ${.embeddings_path}/all_canonical_smiles_smited_embeddings.pkl

# RXNFP vectors are stored as float16 (halves the store); values differ slightly with batch
# composition (max abs about 2e-3) but are identical for a fixed configuration.
rxnfp_batch_size: 2500                                                                                             # Batch size for RXNFP embeddings computation
rxnfp_embeddings_input_pkl_path: ${paths.intermediate_data_dir}/all_rxn_smiles.pkl    # Input pickle path for RXNFP embeddings
rxnfp_embeddings_output_pkl_path: ${.embeddings_path}/unified_reactions_rxnfp_embeddings.pkl                       # Output pickle path for RXNFP embeddings

drfp_embeddings_log_file_name: drfp_embeddings.log
drfp_batch_size: 2500
drfp_n_folded_length: 2048
drfp_min_radius: 0
drfp_radius: 3
drfp_rings: false
drfp_include_hydrogens: false
drfp_embeddings_input_pkl_path: ${paths.intermediate_data_dir}/all_rxn_smiles.pkl
drfp_embeddings_input_dataset_parquet_file_path: null
drfp_embeddings_store_dir: ${.embeddings_path}/drfp/radius3_min0_len2048_rings0_h0/v1

unimol_embeddings_mol_path: ${paths.mol_path.3D}                                                               # Directory for storing 3D molecule files for UNIMOL embeddings
unimol_embeddings_input_pkl_path: ${paths.intermediate_data_dir}/all_canonical_smiles.pkl   # Input pickle path for UNIMOL embeddings
unimol_embeddings_output_pkl_path: ${.embeddings_path}/unified_kinetic_params_unimol_3d_embeddings.pkl              # Output pickle path for UNIMOL embeddings
unimol_sdf_dir: ${paths.sdf_path}
unimol_embeddings_store_dir: ${.embeddings_path}/unimol_sdf/unimolv2/v1
unimol_gpu_ids: ${.gpu_ids}  # List of GPU IDs to use for UNIMOL embeddings computation
unimol_batch_size: 4
unimol_model_size: "1.1B"  # Options: 84m | 164m | 310m | 570m | 1.1B
unimol_num_workers: 0  # 0 = auto-detect os.cpu_count()
unimol_stems_per_batch: 1000000  # Process missing SDF stems in batches to avoid OOM
unimol_log_file_name: unimol_sdf_embeddings.log

molr_batch_size: 500                                                                                              # Batch size for MolR UNIMOL embeddings computation
molr_graph_workers: null                                                                                         # Null uses all available CPU cores for MolR graph construction
molr_use_gpu: true                                                                                               # Use CUDA for MolR inference when available
molr_gpu_ids: ${.gpu_ids}                                                                                                # Local CUDA ids visible inside the MolR process
molr_gpu_batch_size: 2048                                                                                        # Graphs per MolR inference batch
molr_scale_factor: 1536.0  # Constant MolR scale factor applied to every vector; MolR's own code derives it from the first batch
molr_embeddings_input_pkl_path: ${paths.intermediate_data_dir}/all_canonical_smiles.pkl   # Input pickle path for MolR UNIMOL embeddings
molr_embeddings_output_pkl_path: ${.embeddings_path}/unified_kinetic_params_molr_2d_embeddings.pkl                # Output pickle path for MolR embeddings

ecfp_pandarallel:
  progress_bar: false
  nb_workers: 112
ecfp_radius: 2
ecfp_nbits: 1024
# ECFP and AtomPair fingerprints are built with chirality off (stereo-blind, same bits
# for enantiomers); both are stored as uint8 bit vectors.
smiles_ecfp_embeddings_input_pkl_path: ${paths.intermediate_data_dir}/all_canonical_smiles.pkl   # Input pickle path for SMILES ECFP embeddings
smiles_ecfp_embeddings_output_pkl_path: ${.embeddings_path}/unified_kinetic_params_smiles_ecfp_embeddings.pkl            # Output pickle path for SMILES ECFP embeddings

atom_pair_pandarallel:
  progress_bar: false
  nb_workers: 112
atom_pair_nbits: 1024
smiles_atom_pair_embeddings_input_pkl_path: ${paths.intermediate_data_dir}/all_canonical_smiles.pkl   # Input pickle path for SMILES AtomPair embeddings
smiles_atom_pair_embeddings_output_pkl_path: ${.embeddings_path}/unified_kinetic_params_smiles_atom_pair_embeddings.pkl     # Output pickle path for SMILES AtomPair embeddings
