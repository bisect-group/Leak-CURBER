random:
  input_dataset_parquet_file_path: ${oc.env:PROJECT_ROOT}/data/processed/baselines/baselines_ec50/ec50_binding_affinity_dataset_1d.parquet
  output_dir: ${oc.env:PROJECT_ROOT}/data/processed/baselines/baselines_ec50/random_splits
  unique_cols: ${splits.random_unique_cols}

time_split:
  input_dataset_parquet_file_path: ${oc.env:PROJECT_ROOT}/data/processed/baselines/baselines_ec50/ec50_binding_affinity_dataset_1d.parquet
  output_dir: ${oc.env:PROJECT_ROOT}/data/processed/baselines/baselines_ec50/uniprot_time_splits

smiles_split:
  input_dataset_parquet_file_path: ${oc.env:PROJECT_ROOT}/data/processed/baselines/baselines_ec50/ec50_binding_affinity_dataset_1d.parquet
  output_dir: ${oc.env:PROJECT_ROOT}/data/processed/baselines/baselines_ec50/substrate_splits
  unique_similarity_plot_path: ${.output_dir}/${splits.plot_names.unique_smiles_similarity}
  full_dataset_similarity_plot_path: ${.output_dir}/${splits.plot_names.full_smiles_similarity}
  similarity_thresholds:
    - 0.55

sequence_split:
  input_dataset_parquet_file_path: ${oc.env:PROJECT_ROOT}/data/processed/baselines/baselines_ec50/ec50_binding_affinity_dataset_1d.parquet
  output_dir: ${oc.env:PROJECT_ROOT}/data/processed/baselines/baselines_ec50/enzyme_sequence_splits
  unique_similarity_plot_path: ${.output_dir}/${splits.plot_names.unique_enzyme_sequence_similarity}
  full_dataset_similarity_plot_path: ${.output_dir}/${splits.plot_names.full_enzyme_sequence_similarity}
  similarity_thresholds:
    - 0.01

structure_split:
  input_dataset_parquet_file_path: ${oc.env:PROJECT_ROOT}/data/processed/baselines/baselines_ec50/ec50_binding_affinity_dataset_3d.parquet
  output_dir: ${oc.env:PROJECT_ROOT}/data/processed/baselines/baselines_ec50/enzyme_structure_splits
  unique_similarity_plot_path: ${.output_dir}/${splits.plot_names.unique_enzyme_structure_similarity}
  full_dataset_similarity_plot_path: ${.output_dir}/${splits.plot_names.full_enzyme_structure_similarity}
  # Whether to drop the 3D structure features and only keep the 1D sequence features in the output splits.
  # Applicable for models that dint use the 3D structure features and only use the 1D sequence features.
  # Keeping it enabled would skew the TVT ratios after dropping the 3D structure features and deduplicating.
  drop_to_1d: true
  similarity_thresholds:
    - 0.6

cosine_split:
  embeddings_store_dir: ${paths.embeddings_path}/unimol_sdf/unimolv2/v1
  input_dataset_parquet_file_path: ${oc.env:PROJECT_ROOT}/data/processed/baselines/baselines_ec50/ec50_binding_affinity_dataset_1d.parquet
  output_dir: ${oc.env:PROJECT_ROOT}/data/processed/baselines/baselines_ec50/conformer_cosine_splits
  key_column: smiles_hash
  embedding_lookup_mode: conformer
  unique_similarity_plot_path: ${.output_dir}/${splits.plot_names.unique_conformer_similarity}
  full_dataset_similarity_plot_path: ${.output_dir}/${splits.plot_names.full_conformer_similarity}
  similarity_thresholds:
    - 0.997
