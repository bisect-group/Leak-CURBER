# Run profile for RAPIDS cuML RandomForest regression over materialized baseline features.
# cuML RandomForest is GPU and VRAM heavy. Start with one job per GPU and tune slots carefully.

run:
  # Unique run directory name under output_root. Reusing it resumes/skips completed jobs.
  pipeline_id: random_forest_optuna100
  # Root directory for status CSVs, Optuna DBs, logs, best params, and aggregates.
  output_root: logs/baseline_mlp_pipeline
  # Optional explicit data/embedding roots if running from a nonstandard checkout.
  # data_root: outputs/baselines/MLP/data/regression
  # embeddings_root: data/intermediate/embeddings
  # Short backend label used in W&B tags and resolved run metadata.
  label: cuml_random_forest
  # Prefix for endpoint Optuna studies, producing e.g. baseline_cuml_random_forest_kcat_structure.
  study_prefix: baseline_cuml_random_forest
  # Base W&B tags. Stage, endpoint, split, and seed tags are appended by the orchestrator.
  tags: [baseline_regression, rapids, cuml, random_forest]
  # Endpoints to schedule. Valid baseline endpoints: ec50, ic50, kcat, kd, ki, km.
  endpoints: [ec50, ic50, kcat, kd, ki, km]
  # Split families for final runs. HPO split is configured separately under stages.hpo.split.
  splits:
    - random_splits_grouped_sequence
    - random_splits_grouped_smiles
    - uniprot_time_splits
    - substrate_splits
    - enzyme_sequence_splits
    - enzyme_structure_splits
    - conformer_cosine_splits
  # Final-run seeds; estimator random_state is tied to ${seed} below.
  seeds: [666, 777, 888]
  # Optional shortcut for orchestrator modalities; hydra.common.data.modalities is usually enough.
  # modalities: [smited, ecfp, molr, esmc, esm3]

resources:
  # GPU IDs available to the orchestrator. Each child process sees its assigned GPU as cuda:0.
  gpus: [0,2,3]
  # Concurrent jobs per GPU. Keep this at 1 for full-modality cuML RF to avoid VRAM pressure.
  max_slots_per_gpu: 1
  # Concurrent Optuna workers per endpoint study. >1 shares one SQLite study per endpoint.
  hpo_workers_per_endpoint: 3
  # Number of retries for failed subprocess jobs.
  retry_failed: 0
  # Per-job timeout in seconds. 0 disables timeout.
  job_timeout_sec: 0

stages:
  embeddings:
    # false means require existing embedding caches; true computes missing embeddings first.
    enabled: false
    # Recompute the global deduplicated embedding superset instead of reusing cached inputs.
    refresh_superset: false
  materialization:
    # Build/reuse train/val/test .npy feature caches before HPO and final runs.
    enabled: true
    # Force recomputation of materialized features even when a valid cache exists.
    refresh: false
    # metadata validates cache hits without loading full embedding indexes; use full or trust_complete for debugging/speed tradeoffs.
    validation: metadata
    # float32 is the expected dtype for cuML RandomForest.
    feature_dtype: float32
    # Rows per sequential write/read block during materialization.
    block_rows: 65536
    # null uses output_root/_cache/materialized_features, shared across pipeline runs.
    cache_root: null
  hpo:
    # Run endpoint-level Optuna studies before final training.
    enabled: true
    # Split family used to tune hparams. Best params are reused for all final splits.
    split: enzyme_structure_splits
    # Trial cap per endpoint study.
    n_trials: 100
    # Estimator path does not train by epochs, but this stays in generated Hydra overrides.
    max_epochs: 1
    # Base seed for Optuna samplers; each parallel worker gets base + worker_index.
    sampler_seed_base: 42
    # worker_offset avoids duplicate startup suggestions across parallel workers.
    sampler_seed_strategy: worker_offset
    # Estimator HPO does not use Lightning checkpoints.
    checkpoints: false
  final:
    # Run all endpoint x split x seed final jobs after HPO.
    enabled: true
    # Estimator path does not train by epochs, but this stays in generated Hydra overrides.
    max_epochs: 1
    # Estimator profiles do not create Lightning checkpoints; kept for schema parity.
    checkpoints: false
  cleanup:
    # Cleanup is enabled by default; use --no-cleanup for debugging artifacts.
    enabled: true
    # true reports cleanup candidates without deleting them.
    dry_run: false

wandb:
  # W&B project used by all child training jobs.
  project: Leak-CURBER
  # W&B entity/team. Set null or override from CLI if needed.
  entity: bisect-group
  # true writes offline W&B runs; useful for smoke tests and disconnected runs.
  offline: false
  # true skips W&B auth preflight even when offline is false.
  skip_check: false

ui:
  # rich gives live dashboards; plain is best for logs and CI.
  progress_backend: rich
  # Print one-line trial completion events in addition to dashboard summaries.
  hpo_trial_log: false
  # Stream all child subprocess stdout/stderr to the terminal.
  stream_all_jobs: false
  # Disable terminal progress rendering entirely.
  no_progress: false

storage:
  shared_materialized_cache:
    # Shared fingerprinted feature cache under output_root/_cache/materialized_features.
    enabled: true
    # Soft cap across shared cache entries; least-recently-used unprotected entries are pruned.
    max_total_gb: 500
    # Warn when one cache entry is unusually large.
    max_entry_gb: 75
    # Current pruning mode. Only lru is implemented.
    prune_policy: lru
    # Warn/fail before materialization if free disk under the cache root is too low.
    min_free_gb: 500
    # false warns on budget pressure; true turns budget violations into errors.
    fail_if_exceeded: false
  job_artifacts:
    # Delete per-job output_dir/materialized_features. The shared cache is never touched by this.
    delete_job_materialized_features: true
    # HPO metrics are enough for Optuna; prediction arrays are large and are deleted.
    delete_hpo_predictions: true
    # Keep HPO estimator artifacts unless you explicitly want to reclaim more space.
    delete_hpo_models: false
  checkpoints:
    # Estimator profiles rarely write checkpoints, but these settings keep the schema consistent.
    prune_hpo_checkpoints: true
    keep_hpo_best_checkpoint: false
    keep_hpo_last_checkpoint: false
    prune_final_checkpoints: false
    keep_final_best_checkpoint: true
    keep_final_last_checkpoint: false
    max_checkpoint_total_gb: 150
  logs:
    # Report top run/cache disk consumers before and after the pipeline.
    max_run_root_gb: 2000
    fail_if_exceeded: false
    write_disk_report: true

hydra:
  config_groups:
    # Base datamodule config used by every child job.
    data: baseline_regression
    # Start from baseline_regression model config, then replace _target_ below with estimator wrapper.
    model: baseline_regression
    # W&B logger config; logger.wandb.* is overridden from the wandb section above.
    logger: wandb
    # Estimator profiles do not load Lightning callbacks. For a Torch profile, use:
    # callbacks: [default, model_checkpoint, early_stopping]

  common:
    # Fixed Hydra overrides shared by HPO trials and final runs.
    data:
      # Modalities are concatenated in this order. ESM3 uses mean-pooled pdb_ids per row.
      modalities: [smited, ecfp, molr, esmc, esm3]
      # Materialization batch size. Estimator fit consumes memmaps rather than Torch batches.
      batch_size: 8192
      # Must match stages.materialization.feature_dtype for the intended materialized cache.
      materialized_feature_dtype: float32
      # Optional materialization/loader options.
      # num_workers: 0
      # pin_memory: false
    model:
      # Non-Lightning wrapper that calls estimator.fit/predict and writes metrics/artifacts.
      _target_: src.models.baseline_regression_module.BaselineRegressionEstimatorModule
      # Metadata label stored with estimator artifacts.
      backend: cuml_random_forest
      estimator:
        # Hydra target for RAPIDS cuML RandomForestRegressor.
        _target_: cuml.ensemble.RandomForestRegressor
        # Number of trees. Higher is more stable but much slower.
        n_estimators: 200
        # Tree depth cap. null means unlimited depth.
        max_depth: 16
        # Minimum samples per leaf; larger values regularize and speed up fitting.
        min_samples_leaf: 1
        # Features considered at each split: sqrt, log2, float fraction, int count, or null.
        max_features: 1.0
        # Maximum quantile bins for cuML's split algorithm.
        n_bins: 128
        # Parallel CUDA streams used while building the forest.
        n_streams: 4
        # cuML split criterion for regression.
        split_criterion: mse
        # Maximum nodes processed in a batch by cuML.
        max_batch_size: 4096
        # Bootstrap row sampling for each tree.
        bootstrap: true
        # Fraction of rows sampled per tree when bootstrap is true.
        max_samples: 1.0
        # Return NumPy predictions so the shared estimator wrapper can compute metrics directly.
        output_type: numpy
        # Per-final-seed estimator RNG. The orchestrator injects seed for final jobs.
        random_state: ${seed}
        # Optional cuML RandomForest options.
        # min_samples_split: 2
        # max_leaves: -1
        # min_impurity_decrease: 0.0
        # oob_score: false
      # Save fitted estimator with joblib when available.
      save_model: true
      # Save train/val/test prediction arrays.
      save_predictions: true
      # Regression metrics written for train/val/test. pcc mirrors pearson; scc is Spearman.
      metrics: [mse, rmse, mae, r2, pearson, pcc, scc]

  hpo:
    # Local Optuna-4-compatible Hydra sweeper config.
    hparams_search: baseline_regression_optuna4
    # Metric returned to Optuna from estimator validation metrics.
    optimized_metric: val/r2
    # Maximize val/r2. Use minimize for loss-style objectives.
    direction: maximize
    search_space:
      # Discrete choices for tree count.
      model.estimator.n_estimators: "choice(100,200,400,600)"
      # Depth candidates. Hydra sweep choice does not accept null; set max_depth=null manually for unlimited depth.
      model.estimator.max_depth: "choice(8,16,24)"
      # Leaf-size regularization candidates.
      model.estimator.min_samples_leaf: "choice(1,2,4)"
      # Split feature-subset choices.
      model.estimator.max_features: "choice(sqrt,log2,0.5,1.0)"
      # cuML quantile-bin choices; lower values reduce memory, higher can improve accuracy.
      model.estimator.n_bins: "choice(64,128,256)"
      # Row-sampling fraction per tree.
      model.estimator.max_samples: "choice(0.7,0.85,1.0)"

  final: {}
  # final can hold fixed final-only overrides after best HPO params are applied.
  # final:
  #   model:
  #     estimator:
  #       n_streams: 2

  raw_overrides:
    # Advanced escape hatch: appended after structured common/HPO/final overrides.
    common: []
    hpo:
      - "hydra.sweeper.sampler.n_startup_trials=20"
      - "hydra.sweeper.sampler.multivariate=true"
      - "hydra.sweeper.sampler.constant_liar=true"
      - "hydra.sweeper.max_consecutive_failed_trials=5"
      - "hydra.sweeper.stale_trial_timeout_sec=7200"
      - "hydra.sweeper.stale_trial_check_interval_sec=300"
      - "hydra.sweeper.fail_stale_running_trials=true"
      - "++model.save_predictions=false"
    final: []
    # Example: common: ["++model.estimator.oob_score=true"]
