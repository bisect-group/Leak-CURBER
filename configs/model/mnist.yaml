_target_: src.models.mnist_module.MNISTLitModule

net:
  _target_: src.models.components.simple_dense_net.SimpleDenseNet
  input_size: 784
  lin1_size: 64
  lin2_size: 128
  lin3_size: 64
  output_size: 10

# use optimizer and scheduler defined in configs/optimizer and configs/scheduler
optimizer: ${optimizer}
scheduler: ${scheduler}
# compile model for faster training with pytorch 2.0
compile: false
