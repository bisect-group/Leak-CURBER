[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = true
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[tool.ruff]
# Ruff configuration to replace Black/isort/Flake8/pyupgrade in pre-commit
line-length = 99
target-version = "py310"

# Keep some ignores that were present in the previous flake8 config
lint.extend-ignore = ["E203", "E402", "E501"]

# Exclude generated data, logs and large folders
exclude = ["logs/*", "data/*", "build/*", "dist/*", "__pycache__", "*.pyc", "pixi.lock", "environment.yaml"]

# Allow unused imports in package __init__ files and relaxed docstring checks in tests
lint.per-file-ignores = {"__init__.py" = ["F401"], "tests/*" = ["D"]}
