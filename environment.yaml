# Curated direct dependencies, pinned to the versions of the environment used for the paper runs.
# One-step setup: bash scripts/setup_env.sh
# Manual setup:
#   conda env create -f environment.yaml
#   conda activate leakcurber
#   pip install --no-deps -r requirements-nodeps.txt   # dgl, git packages (esm, smi-ted, MolR, ...)
#   pip install --no-deps -e .
# Only python and pip come from conda. Everything else is installed with pip.

name: leakcurber

channels:
  - defaults
  - conda-forge

dependencies:
  - python=3.12.12
  - pip=26.0.1
  - pip:
      # torch builds are CUDA 13.2 wheels from the PyTorch index.
      - --extra-index-url https://download.pytorch.org/whl/cu132
      - torch==2.12.0+cu132
      - torchvision==0.27.0+cu132
      - torchmetrics==1.9.0
      - lightning==2.6.1
